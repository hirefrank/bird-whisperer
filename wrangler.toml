#:schema node_modules/wrangler/config-schema.json
# Deploy to Cloudflare template config.
# Keep this file generic for one-click deploy.
# Put personal overrides in wrangler.local.toml (gitignored).

name = "bird-whisperer"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true

[[kv_namespaces]]
binding = "BIRD_WHISPERER"
id = "your-kv-namespace-id"

[[send_email]]
name = "EMAIL"

[vars]
# Optional provider override: "resend" or "cloudflare"
# EMAIL_PROVIDER = "resend"

# Optional sender overrides (works for both providers)
# EMAIL_FROM = "Bird Whisperer <noreply@example.com>"
# EMAIL_REPLY_TO = "you@example.com"

[triggers]
crons = ["0 13 * * *"]
